# Publish packable projects to nuget.org via Trusted Publishing (OIDC).
#
# Setup (one-time on nuget.org):
#   Account → Trusted Publishing → add policy:
#     Repository owner : WavestormSoftware
#     Repository       : Elsie
#     Workflow file    : publish-nuget.yml
#     Environment      : nuget
#
# NuGet/login `user` = nuget.org username of the **person who created the
# policy** (Account settings → Username), NOT the org Package Owner.
# Set repo variable NUGET_USER to that username.
#
# Package IDs:
#   Elsie (host → Elsie.Core), Elsie.Core,
#   Elsie.Auth, Elsie.Cors, Elsie.Testing, Elsie.Views, Elsie.Templates
#
# Docs: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

name: publish-nuget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack + validate only; skip nuget login/push"
        type: boolean
        default: true
      nuget_user:
        description: "nuget.org username of the Trusted Publishing policy creator (overrides NUGET_USER var)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # required for GitHub OIDC → NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read package version
        id: ver
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Resolve NuGet policy-creator username
        id: who
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        env:
          INPUT_USER: ${{ inputs.nuget_user }}
          VAR_USER: ${{ vars.NUGET_USER }}
        run: |
          user="${INPUT_USER:-$VAR_USER}"
          if [ -z "$user" ]; then
            echo "::error::Set repo variable NUGET_USER (or workflow input nuget_user) to the nuget.org username of the Trusted Publishing policy creator — not org WavestormSoftware."
            exit 1
          fi
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Elsie.sln

      - name: Test
        run: dotnet test Elsie.sln -c Release --verbosity minimal

      - name: Pack libraries + templates
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget

          projects=(
            src/Elsie.Core/Elsie.Core.csproj
            src/Elsie/Elsie.csproj
            src/Elsie.Auth/Elsie.Auth.csproj
            src/Elsie.Cors/Elsie.Cors.csproj
            src/Elsie.Testing/Elsie.Testing.csproj
            src/Elsie.Views/Elsie.Views.csproj
            src/Elsie.Validation/Elsie.Validation.csproj
            templates/Elsie.Templates.csproj
          )

          for proj in "${projects[@]}"; do
            echo "Packing $proj"
            dotnet pack "$proj" -c Release -o artifacts/nuget --no-restore
          done

          echo "--- artifacts ---"
          ls -la artifacts/nuget

      - name: Validate expected packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          required=(
            "Elsie.$version.nupkg"
            "Elsie.Core.$version.nupkg"
            "Elsie.Auth.$version.nupkg"
            "Elsie.Cors.$version.nupkg"
            "Elsie.Testing.$version.nupkg"
            "Elsie.Views.$version.nupkg"
            "Elsie.Validation.$version.nupkg"
            "Elsie.Templates.$version.nupkg"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "artifacts/nuget/$f" ]]; then
              echo "MISSING $f"
              missing=1
            else
              echo "ok $f"
            fi
          done

          host="artifacts/nuget/Elsie.$version.nupkg"
          tmp=$(mktemp -d)
          unzip -q -o "$host" -d "$tmp"
          nuspec=$(find "$tmp" -name '*.nuspec' | head -1)
          cat "$nuspec"
          grep -q 'id="Elsie.Core"' "$nuspec" || { echo "Elsie host missing Elsie.Core dep"; missing=1; }
          find "$tmp" -name 'Elsie.Web.dll' | grep -q . || { echo "Elsie host missing Elsie.Web.dll"; missing=1; }
          rm -rf "$tmp"
          exit "$missing"

      - name: Upload pack artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: NuGet login (Trusted Publishing OIDC)
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ steps.who.outputs.user }}

      - name: Push to nuget.org
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/nuget/*.nupkg)
          symbols=(artifacts/nuget/*.snupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No nupkg files found" >&2
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            # Skip symbol packages in the *.nupkg glob if any — only real packages
            case "$pkg" in
              *.snupkg) continue ;;
            esac
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          for pkg in "${symbols[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              || echo "Symbol push skipped/failed for $pkg (non-fatal)"
          done

# Publish packable projects to nuget.org via Trusted Publishing (OIDC).
#
# nuget.org Trusted Publishing policy must match:
#   Repository owner : WavestormSoftware
#   Repository       : Elsie
#   Workflow         : publish-nuget.yml
#   Environment      : nuget
#
# NuGet/login `user` = nuget.org username of the **person who created the
# policy** (Account settings → Username). NOT the org Package Owner
# (WavestormSoftware). Set repo variable NUGET_USER to that username, or pass
# workflow_dispatch input nuget_user.
#
# Package IDs published (0.3.0-alpha.1+):
#   Elsie (meta → Elsie.Web → Elsie.Core), Elsie.Core, Elsie.Web,
#   Elsie.Auth, Elsie.Cors, Elsie.Testing, Elsie.Views, Elsie.Templates
# Retired IDs (do not pack): Elsie.AspNetCore, Elsie.HealthChecks,
#   Elsie.RateLimiting, Elsie.FluentValidation
# First push of Elsie.Web requires Trusted Publishing allowance for new package ID.
# Existing package policies cover version bumps; new IDs may need a policy/owner
# confirm on nuget.org.
#
# Docs: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing

name: publish-nuget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only; skip nuget push"
        type: boolean
        default: false
      nuget_user:
        description: "nuget.org username of the Trusted Publishing policy creator (overrides NUGET_USER var)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # OIDC for NuGet Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve NuGet policy-creator username
        id: who
        env:
          INPUT_USER: ${{ inputs.nuget_user }}
          VAR_USER: ${{ vars.NUGET_USER }}
        run: |
          user="${INPUT_USER:-$VAR_USER}"
          if [ -z "$user" ]; then
            echo "::error::Set repo variable NUGET_USER (or workflow input nuget_user) to the nuget.org username of the Trusted Publishing policy creator — not org WavestormSoftware."
            exit 1
          fi
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Elsie.sln

      - name: Test
        run: dotnet test Elsie.sln -c Release --verbosity minimal

      - name: Pack libraries + templates
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget

          projects=(
            src/Elsie/Elsie.csproj
            src/Elsie.Web/Elsie.Web.csproj
            src/Elsie.Meta/Elsie.Meta.csproj
            src/Elsie.Auth/Elsie.Auth.csproj
            src/Elsie.Cors/Elsie.Cors.csproj
            src/Elsie.Testing/Elsie.Testing.csproj
            src/Elsie.Views/Elsie.Views.csproj
            templates/Elsie.Templates.csproj
          )

          for proj in "${projects[@]}"; do
            echo "Packing $proj"
            dotnet pack "$proj" -c Release -o artifacts/nuget --no-restore
          done

          echo "--- artifacts ---"
          ls -la artifacts/nuget

      - name: Validate expected packages
        run: |
          set -euo pipefail
          version="0.3.0-alpha.1"
          required=(
            "Elsie.$version.nupkg"
            "Elsie.Core.$version.nupkg"
            "Elsie.Web.$version.nupkg"
            "Elsie.Auth.$version.nupkg"
            "Elsie.Cors.$version.nupkg"
            "Elsie.Testing.$version.nupkg"
            "Elsie.Views.$version.nupkg"
            "Elsie.Templates.$version.nupkg"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "artifacts/nuget/$f" ]]; then
              echo "MISSING $f"
              missing=1
            else
              echo "ok $f"
            fi
          done
          exit "$missing"

      - name: NuGet login (Trusted Publishing OIDC)
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        uses: NuGet/login@v1
        id: nuget
        with:
          # Must be policy CREATOR username, not Package Owner org.
          user: ${{ steps.who.outputs.user }}

      - name: Push to nuget.org
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(artifacts/nuget/*.nupkg)
          symbols=(artifacts/nuget/*.snupkg)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "No nupkg files found" >&2
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          # Symbols (when produced alongside nupkgs)
          for pkg in "${symbols[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              || echo "Symbol push skipped/failed for $pkg (non-fatal)"
          done

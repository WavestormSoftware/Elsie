name: http3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  http3-interop:
    name: HTTP/3 interop (curl --http3 + aioquic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Install libmsquic
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Run HTTP/3 + gRPC test suites (libmsquic installed)
        run: |
          set -euo pipefail
          # The runtime h3 tests (QPACK codec, h3 server, h3 scope/DI, WS-over-h3) and the
          # gRPC suite only execute when libmsquic is present; locally they vacate via
          # QuicListener.IsSupported checks. apt-install msquic above makes them run here.
          # `timeout` bounds each command; --blame-hang reports any test still running when
          # the hang deadline fires so a wedged QUIC run fails with diagnostics instead of
          # cancelling the whole job at the step timeout.
          timeout 900 dotnet test tests/Elsie.Web.Tests -c Release --filter "FullyQualifiedName~Http3" \
            --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none
          timeout 900 dotnet test tests/Elsie.Grpc.Tests -c Release \
            --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Build h3 sample
        run: dotnet build samples/Elsie.Sample.Http3/Elsie.Sample.Http3.csproj -c Release

      - name: Start sample (h3 on 8443)
        run: |
          # setsid detaches the server from the runner's process group so the job can finish.
          setsid nohup dotnet run --project samples/Elsie.Sample.Http3 -c Release --no-build -- \
            --urls https://127.0.0.1:8443 > /tmp/h3-sample.log 2>&1 < /dev/null &
          echo $! > /tmp/h3-sample.pid
          for i in $(seq 1 40); do
            if curl -s -k -o /dev/null --max-time 2 https://127.0.0.1:8443/ping 2>/dev/null; then
              break
            fi
            sleep 1
          done
          sleep 2
          cat /tmp/h3-sample.log

      - name: curl --http3 probe
        run: |
          set -euo pipefail
          # Neither the runner's stock curl nor the official curlimages/curl image is built
          # with HTTP/3 (no ngtcp2/nghttp3) — use the static curl build that ships them.
          curl -sSL -o /tmp/curl-h3.tar.xz \
            https://github.com/stunnel/static-curl/releases/download/8.21.0/curl-linux-x86_64-glibc-8.21.0.tar.xz
          tar -xf /tmp/curl-h3.tar.xz -C /tmp
          chmod +x /tmp/curl
          /tmp/curl --version | grep -q nghttp3
          body=$(/tmp/curl --http3 -s -k --max-time 15 https://127.0.0.1:8443/ping)
          echo "body=$body"
          grep -q '"protocol":"h3"' <<< "$body"
          # QPACK dynamic-table-exercising request: the repeated header fields let curl's
          # QPACK encoder insert into the table advertised by the server (4096 by default).
          body2=$(/tmp/curl --http3 -s -k --max-time 15 \
            -H 'X-Dyn-1: value-one' -H 'X-Dyn-1: value-two' \
            -H 'X-Long-Header: '"$(printf 'a%.0s' {1..200})" https://127.0.0.1:8443/ping)
          echo "body2=$body2"
          grep -q '"status":"ok"' <<< "$body2"

      - name: aioquic interop probe (QPACK dynamic table)
        run: |
          set -euo pipefail
          pip install --quiet aioquic
          python3 - <<'PY'
          import sys
          sys.path.insert(0, __import__('site').getsitepackages()[0])
          from aioquic.asyncio.client import connect
          from aioquic.quic.configuration import QuicConfiguration
          from aioquic.h3.connection import H3Connection
          from aioquic.h3.events import HeadersReceived
          import asyncio
          
          async def main():
              config = QuicConfiguration(is_client=True, alpn_protocols=["h3"])
              config.verify_mode = False  # self-signed sample cert
              async with connect("127.0.0.1", 8443, configuration=config) as client:
                  # Current aioquic: H3Connection wraps the underlying QuicConnection, not the
                  # protocol object; transmit() flushes buffered datagrams to the socket.
                  h3 = H3Connection(client._quic)
                  # Several requests sharing repeated header fields so the aioquic encoder inserts
                  # into the server's advertised QPACK dynamic table (capacity 4096) and the server
                  # decoder must process the encoder-stream instructions + blocked streams.
                  for i in range(3):
                      headers = [(b":method", b"GET"), (b":scheme", b"https"),
                                 (b":authority", b"127.0.0.1:8443"), (b":path", b"/ping"),
                                 (b"x-dyn", b"value-%d" % i),
                                 (b"x-dyn", b"shared-value")]
                      stream_id = h3.send_headers(headers, stream_id=client._quic.get_next_available_stream_id())
                      h3.send_data(b"", stream_id=stream_id)
                      client.transmit()
                      status = None
                      while status is None:
                          event = await client.wait_for_event()
                          for e in h3.handle_event(event):
                              if isinstance(e, HeadersReceived):
                                  for k, v in e.headers:
                                      if k == b":status":
                                          status = int(v)
                      assert status == 200, f"h3 status {status}"
                  print(f"aioquic dynamic-table requests -> 200 x3")
          
          asyncio.run(main())
          PY

      - name: Stop sample
        if: always()
        run: |
          pid=$(cat /tmp/h3-sample.pid 2>/dev/null || true)
          if [ -n "$pid" ]; then
            kill -TERM -- -"$pid" 2>/dev/null || kill -9 "$pid" 2>/dev/null || true
          fi
          pkill -f Elsie.Sample.Http3 2>/dev/null || true

      - name: Reap orphaned test processes
        if: always()
        run: |
          # A wedged test run must not leak testhost/server processes into later steps.
          pkill -f 'testhost' 2>/dev/null || true
          pkill -f 'Elsie.Web.Tests' 2>/dev/null || true
          pkill -f 'Elsie.Grpc.Tests' 2>/dev/null || true

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== surviving dotnet/Elsie processes ==="
          ps auxf | grep -E 'dotnet|testhost|Elsie' | grep -v grep || true
          echo "=== h3 sample log ==="
          cat /tmp/h3-sample.log 2>/dev/null || true
          echo "=== blame-hang / test logs ==="
          find . -name '*.trx' -o -name 'Sequence_*.xml' 2>/dev/null | head -20 || true

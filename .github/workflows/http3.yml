name: http3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  http3-interop:
    name: HTTP/3 interop (curl --http3 + aioquic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Install libmsquic
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - name: Build h3 sample
        run: dotnet build samples/Elsie.Sample.Http3/Elsie.Sample.Http3.csproj -c Release

      - name: Start sample (h3 on 8443)
        run: |
          nohup dotnet run --project samples/Elsie.Sample.Http3 -c Release --no-build -- \
            --urls https://127.0.0.1:8443 > /tmp/h3-sample.log 2>&1 &
          echo $! > /tmp/h3-sample.pid
          for i in $(seq 1 40); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:8443/ 2>/dev/null; then
              break
            fi
            sleep 1
          done
          sleep 2
          cat /tmp/h3-sample.log

      - name: curl --http3 probe
        run: |
          set -euo pipefail
          body=$(curl --http3 -s -k --max-time 15 https://127.0.0.1:8443/ping)
          echo "body=$body"
          grep -q '"protocol":"h3"' <<< "$body"
          # QPACK dynamic-table-exercising request (long header value list).
          body2=$(curl --http3 -s -k --max-time 15 -H 'X-Long-Header: '"$(printf 'a%.0s' {1..200})" https://127.0.0.1:8443/ping)
          echo "body2=$body2"
          grep -q '"status":"ok"' <<< "$body2"

      - name: aioquic interop probe
        run: |
          set -euo pipefail
          pip install --quiet aioquic
          python3 - <<'PY'
import sys
sys.path.insert(0, __import__('site').getsitepackages()[0])
from aioquic.asyncio.client import connect
from aioquic.quic.configuration import QuicConfiguration
from aioquic.h3.connection import H3Connection
from aioquic.h3.events import HeadersReceived, DataReceived
import asyncio

async def main():
    config = QuicConfiguration(is_client=True, alpn_protocols=["h3"])
    config.verify_mode = False  # self-signed sample cert
    async with connect("127.0.0.1", 8443, configuration=config) as client:
        h3 = H3Connection(client)
        headers = [(b":method", b"GET"), (b":scheme", b"https"),
                   (b":authority", b"127.0.0.1:8443"), (b":path", b"/ping")]
        stream_id = h3.send_headers(headers, stream_id=client.get_next_available_stream_id())
        h3.send_data(b"", stream_id=stream_id)
        status = None
        while status is None:
            event = await client.wait_for_event()
            for e in h3.handle_event(event):
                if isinstance(e, HeadersReceived):
                    for k, v in e.headers:
                        if k == b":status":
                            status = int(v)
        assert status == 200, f"h3 status {status}"
        print(f"aioquic GET /ping -> {status}")

asyncio.run(main())
PY

      - name: Stop sample
        if: always()
        run: |
          kill "$(cat /tmp/h3-sample.pid)" 2>/dev/null || true

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Elsie.sln
      - name: Build
        run: dotnet build Elsie.sln -c Release --no-restore
      - name: Test
        run: dotnet test Elsie.sln -c Release --no-build --verbosity normal
      - name: Pack templates
        run: dotnet pack templates/Elsie.Templates.csproj -c Release -o artifacts/nuget

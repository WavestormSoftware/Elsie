name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Elsie.sln

      - name: Build
        run: dotnet build Elsie.sln -c Release --no-restore

      - name: Test
        run: dotnet test Elsie.sln -c Release --no-build --verbosity normal

      - name: Read package version
        id: ver
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Pack libraries + templates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          projects=(
            src/Elsie/Elsie.csproj
            src/Elsie.Web/Elsie.Web.csproj
            src/Elsie.Meta/Elsie.Meta.csproj
            src/Elsie.Auth/Elsie.Auth.csproj
            src/Elsie.Cors/Elsie.Cors.csproj
            src/Elsie.Testing/Elsie.Testing.csproj
            src/Elsie.Views/Elsie.Views.csproj
            templates/Elsie.Templates.csproj
          )
          for proj in "${projects[@]}"; do
            dotnet pack "$proj" -c Release -o artifacts/nuget --no-build
          done

      - name: Validate packs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          required=(
            "Elsie.$version.nupkg"
            "Elsie.Core.$version.nupkg"
            "Elsie.Web.$version.nupkg"
            "Elsie.Auth.$version.nupkg"
            "Elsie.Cors.$version.nupkg"
            "Elsie.Views.$version.nupkg"
            "Elsie.Testing.$version.nupkg"
            "Elsie.Templates.$version.nupkg"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "artifacts/nuget/$f" ]]; then
              echo "MISSING $f"
              missing=1
            else
              echo "ok $f"
            fi
          done

          # Metapackage Elsie must declare Elsie.Web dependency + TFMs
          meta="artifacts/nuget/Elsie.$version.nupkg"
          tmp=$(mktemp -d)
          unzip -q -o "$meta" -d "$tmp"
          nuspec=$(find "$tmp" -name '*.nuspec' | head -1)
          echo "--- Elsie.nuspec ---"
          cat "$nuspec"
          if ! grep -q 'id="Elsie.Web"' "$nuspec"; then
            echo "Elsie metapackage missing Elsie.Web dependency"
            missing=1
          fi
          if ! grep -q 'targetFramework="net8.0"' "$nuspec" && ! grep -q "targetFramework=\".NETCoreApp,Version=v8.0\"" "$nuspec"; then
            # accept either short or long TFM form
            if ! grep -qi 'net8' "$nuspec"; then
              echo "Elsie metapackage missing net8.0 dependency group"
              missing=1
            fi
          fi
          rm -rf "$tmp"
          exit $missing

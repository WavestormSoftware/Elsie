name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Elsie.sln
      - name: Build
        run: dotnet build Elsie.sln -c Release --no-restore
      - name: Test
        run: dotnet test Elsie.sln -c Release --no-build --verbosity normal
      - name: Coverage (non-blocking)
        continue-on-error: true
        run: >
          dotnet test Elsie.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --verbosity minimal
      - name: Pack libraries + templates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          projects=(
            src/Elsie/Elsie.csproj
            src/Elsie.AspNetCore/Elsie.AspNetCore.csproj
            src/Elsie.Meta/Elsie.Meta.csproj
            src/Elsie.Auth/Elsie.Auth.csproj
            src/Elsie.Cors/Elsie.Cors.csproj
            src/Elsie.FluentValidation/Elsie.FluentValidation.csproj
            src/Elsie.HealthChecks/Elsie.HealthChecks.csproj
            src/Elsie.RateLimiting/Elsie.RateLimiting.csproj
            src/Elsie.Testing/Elsie.Testing.csproj
            src/Elsie.Views/Elsie.Views.csproj
            templates/Elsie.Templates.csproj
          )
          for proj in "${projects[@]}"; do
            dotnet pack "$proj" -c Release -o artifacts/nuget --no-build
          done
      - name: Validate packs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            Elsie.0.2.0-alpha.2.nupkg
            Elsie.Core.0.2.0-alpha.2.nupkg
            Elsie.AspNetCore.0.2.0-alpha.2.nupkg
            Elsie.Auth.0.2.0-alpha.2.nupkg
            Elsie.Cors.0.2.0-alpha.2.nupkg
            Elsie.HealthChecks.0.2.0-alpha.2.nupkg
            Elsie.RateLimiting.0.2.0-alpha.2.nupkg
            Elsie.Views.0.2.0-alpha.2.nupkg
            Elsie.FluentValidation.0.2.0-alpha.2.nupkg
            Elsie.Testing.0.2.0-alpha.2.nupkg
            Elsie.Templates.0.2.0-alpha.2.nupkg
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "artifacts/nuget/$f" ]]; then
              echo "MISSING $f"
              missing=1
            else
              echo "ok $f"
            fi
          done
          exit $missing

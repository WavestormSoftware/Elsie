name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore Elsie.sln

      - name: Format check
        run: dotnet format Elsie.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Elsie.sln -c Release --no-restore

      - name: Test + coverage
        # Bounded: a wedged test (e.g. a QUIC transport hang on Windows) must fail the step
        # with hang diagnostics instead of running until the job-level timeout cancels it.
        # -m:1 serializes the per-project test hosts: on 2-vCPU runners, running 10 testhosts
        # (+ Testcontainers) concurrently starved socket deadlines into flaky failures.
        timeout-minutes: 20
        run: >
          dotnet test Elsie.sln -c Release --no-build -m:1 --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none

      - name: Vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          # Fail the job if any vulnerable package is reported (exit code 1 from list).
          if ! dotnet list Elsie.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt; then
            echo "dotnet list package --vulnerable failed"
            exit 1
          fi
          if grep -qiE 'has the following vulnerable|Severity' vuln.txt; then
            echo "Vulnerable packages detected"
            cat vuln.txt
            exit 1
          fi
          echo "No vulnerable packages reported."

      - name: Read package version
        id: ver
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Pack libraries + templates
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          projects=(
            src/Elsie.Core/Elsie.Core.csproj
            src/Elsie/Elsie.csproj
            src/Elsie.Auth/Elsie.Auth.csproj
            src/Elsie.Cors/Elsie.Cors.csproj
            src/Elsie.Testing/Elsie.Testing.csproj
            src/Elsie.Views/Elsie.Views.csproj
            src/Elsie.Validation/Elsie.Validation.csproj
            src/Elsie.Extensions.RateLimiting.Redis/Elsie.Extensions.RateLimiting.Redis.csproj
            src/Elsie.Extensions.Auth.Redis/Elsie.Extensions.Auth.Redis.csproj
            src/Elsie.Grpc/Elsie.Grpc.csproj
            templates/Elsie.Templates.csproj
          )
          for proj in "${projects[@]}"; do
            dotnet pack "$proj" -c Release -o artifacts/nuget --no-build
          done

      - name: Validate packs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          required=(
            "Elsie.$version.nupkg"
            "Elsie.Core.$version.nupkg"
            "Elsie.Auth.$version.nupkg"
            "Elsie.Cors.$version.nupkg"
            "Elsie.Views.$version.nupkg"
            "Elsie.Testing.$version.nupkg"
            "Elsie.Validation.$version.nupkg"
            "Elsie.Extensions.RateLimiting.Redis.$version.nupkg"
            "Elsie.Extensions.Auth.Redis.$version.nupkg"
            "Elsie.Grpc.$version.nupkg"
            "Elsie.Templates.$version.nupkg"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "artifacts/nuget/$f" ]]; then
              echo "MISSING $f"
              missing=1
            else
              echo "ok $f"
            fi
          done

          host="artifacts/nuget/Elsie.$version.nupkg"
          tmp=$(mktemp -d)
          unzip -q -o "$host" -d "$tmp"
          nuspec=$(find "$tmp" -name '*.nuspec' | head -1)
          echo "--- Elsie.nuspec ---"
          cat "$nuspec"
          if ! grep -q 'id="Elsie.Core"' "$nuspec"; then
            echo "Elsie host package missing Elsie.Core dependency"
            missing=1
          fi
          if ! find "$tmp" -name 'Elsie.Web.dll' | grep -q .; then
            echo "Elsie host package missing Elsie.Web.dll"
            missing=1
          fi
          if ! find "$tmp/lib" -type d -name 'net10.0' | grep -q .; then
            echo "Elsie host package missing lib/net10.0"
            missing=1
          fi
          if find "$tmp/lib" -type d -name 'net8.0' | grep -q .; then
            echo "Elsie host package unexpectedly contains lib/net8.0"
            missing=1
          fi
          rm -rf "$tmp"
          exit $missing

  aot-smoke:
    name: Native AOT smoke (per-PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Install AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish AOT smoke binary
        run: >
          dotnet publish tools/Elsie.AotSmoke/Elsie.AotSmoke.csproj
          -c Release -r linux-x64 -o artifacts/aot-smoke
          /p:PublishAot=true /p:TreatWarningsAsErrors=false

      - name: Run trimmed binary
        run: ./artifacts/aot-smoke/Elsie.AotSmoke
